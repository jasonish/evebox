[package]
name = "evebox"
# Suffix with -dev when not a release.
version = "0.31.0"
authors = ["Jason Ish <ish@unx.ca>"]
edition = "2024"
description = "A web based Suricata event manager"
license = "MIT"
homepage = "https://evebox.org"
repository = "https://github.com/jasonish/evebox"
documentation = "https://evebox.org"

# This is not a guarantee, just helps notify me when the MSRV changes.
rust-version = "1.88.0"

[profile.release]
lto = true
opt-level = 3

[dependencies]
anyhow = "1.0.104"
thiserror = "2.0.21"

axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
axum-extra = { version = "0.12.6", default-features = false, features = ["cookie", "typed-header", "form"] }
tokio = { version = "1", default-features = false, features = ["signal", "macros", "rt-multi-thread", "fs", "net", "process", "sync", "time"] }
tower-http = { version = "0.7", features = ["set-header", "trace", "limit"] }
futures = "0.3.34"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.15", features = ["alloc", "std"] }

base64 = "0.23.1"
bcrypt = "0.19.3"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["env", "derive", "color"] }

sqlx = { version = "0.8.6", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite", "tls-rustls", "json", "chrono"] }

filetime = "0.2.29"
flate2 = "1.1.10"
glob = "0.3.4"
humantime = "2.4.0"
lazy_static = "1.5.1"
maxminddb = "0.32.0"
md5 = "0.8.1"
mime_guess = "2.0.5"
nom = "8"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "stream"] }
rust-embed = { version = "8.12.0", features = ["debug-embed"] }
semver = "1"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"

suricatax-rule-parser = "0.2.0-alpha.1"

# Currently only used for tracing_subscriber based logging.
time = { version = "0.3.55", features = ["macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter", "time", "local-time"] }
tracing-log = "0.2.0"

ulid = "3.0.0"
uuid = { version = "1.26.1", features = ["v4"] }
webbrowser = "1.2.4"
regex = "1.13.1"
libc = { version = "0.2.190", default-features = false }
rcgen = "0.14.10"
directories = "6.0.0"
gethostname = "1.1.0"
tempfile = "3.27.0"
tar = "0.4.46"
inquire = "0.9.4"
chrono = { version = "0.4.45", default-features = false, features = ["std", "now", "serde"] }
log = "0.4.34"
owo-colors = "4.4.0"
indexmap = "2.14.2"
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = { version = "0.7.19", features = ["io"] }
async-trait = "0.1.92"
same-file = "1.0.6"
xz2 = { version = "0.1.7", features = ["static"] }

# Agent WebSocket control channel. Keep its rustls stack aligned with
# axum's WebSocket support; the verifying connector uses native roots.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }

[target.'cfg(not(windows))'.dependencies]
pcap = { version = "2.5.0", default-features = false }

[target.'cfg(windows)'.dependencies]
libloading = "0.9"
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation", "Win32_System_LibraryLoader"] }
